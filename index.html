<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nature Therapy Club</title>
<meta name="description" content="A space for mental health, weekly. Every Wednesday 4:30 to 5:30pm at the Plant Conservatory.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500&family=Fraunces:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    text-align: center;
    background: #999a8d;
    color: #000;
    font-family: "DM Sans", system-ui, sans-serif;
  }
  /* The first screen: title, time and links, centred, nothing else. */
  .landing {
    min-height: calc(100vh - 48px);
    min-height: calc(100dvh - 48px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  h1 {
    margin: 0;
    font-family: Fraunces, Georgia, serif;
    font-weight: 600;
    font-size: clamp(2.4rem, 8vw, 5rem);
    letter-spacing: -0.01em;
    line-height: 1.05;
  }
  .tagline {
    margin: 16px 0 0;
    font-family: Fraunces, Georgia, serif;
    font-style: italic;
    font-size: clamp(1.1rem, 3vw, 1.6rem);
  }
  .when {
    margin: clamp(48px, 10vh, 96px) 0 0;
    font-size: clamp(1rem, 2.4vw, 1.25rem);
    line-height: 1.6;
  }
  nav {
    margin-top: clamp(48px, 10vh, 96px);
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    justify-content: center;
  }
  nav a {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 16px 30px;
    border-radius: 999px;
    background: #111;
    color: #fff;
    text-decoration: none;
    font-size: 1.05rem;
    box-shadow: 0 2px 0 rgba(0, 0, 0, 0.35), 0 8px 20px rgba(0, 0, 0, 0.18);
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
  }
  nav a::after { content: "\2192"; transition: transform 0.15s; }  /* arrow */
  nav a:hover, nav a:focus-visible {
    background: #000;
    transform: translateY(-2px);
    box-shadow: 0 4px 0 rgba(0, 0, 0, 0.35), 0 14px 28px rgba(0, 0, 0, 0.22);
  }
  nav a:hover::after, nav a:focus-visible::after { transform: translateX(4px); }
  nav a:active { transform: translateY(1px); box-shadow: 0 1px 0 rgba(0, 0, 0, 0.35); }
  nav a:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { nav a, nav a::after { transition: none; } }
  /* Three photos, below the first screen. */
  .photos {
    max-width: 960px;
    margin: clamp(48px, 12vh, 120px) auto clamp(72px, 14vh, 140px);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: clamp(12px, 3vw, 32px);
  }
  .photos img {
    width: 100%;
    aspect-ratio: 3 / 4;
    object-fit: cover;
    display: block;
    border-radius: 4px;
  }
  @media (max-width: 560px) {
    .photos { grid-template-columns: 1fr; max-width: 320px; }
  }
</style>
</head>
<body>
  <main>
   <section class="landing">
    <h1>Nature Therapy Club</h1>
    <p class="tagline">A space for mental health, weekly.</p>
    <p class="when">Every Wednesday 4:30 – 5:30pm<br>Plant Conservatory</p>
    <nav aria-label="Links">
      <a href="https://groupme.com/join_group/118132930/fqRumv3G">Join the GroupMe</a>
      <a href="https://www.instagram.com/calpolyntc/">@CalPolyNTC on Instagram</a>
    </nav>
   </section>
   <section class="photos" aria-label="Photos from our walks">
    <img src="photos/shadows.jpg" alt="Three long shadows waving on a dirt trail" width="800" height="1200" loading="lazy">
    <img src="photos/trail.jpg" alt="A dirt road under oak trees at sunset" width="1200" height="800" loading="lazy">
    <img src="photos/canopy.jpg" alt="Looking up through oak branches at the sky" width="800" height="1200" loading="lazy">
   </section>
  </main>
</body>
</html>
